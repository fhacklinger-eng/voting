<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Mediterranean Table UI concept</title>
  <desc id="desc">Four mobile mockups show the captain home, rating, organizer status, and final reveal screens.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#26322C" flood-opacity="0.14"/>
    </filter>
    <clipPath id="p1"><rect x="72" y="194" width="316" height="666" rx="32"/></clipPath>
    <clipPath id="p2"><rect x="452" y="194" width="316" height="666" rx="32"/></clipPath>
    <clipPath id="p3"><rect x="832" y="194" width="316" height="666" rx="32"/></clipPath>
    <clipPath id="p4"><rect x="1212" y="194" width="316" height="666" rx="32"/></clipPath>
    <style>
      .ui { font-family: Arial, Helvetica, sans-serif; fill: #26322C; }
      .display { font-family: Georgia, 'Times New Roman', serif; fill: #26322C; }
      .meta { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; }
      .phone-label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #26322C; }
